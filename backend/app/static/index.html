<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetForeSight AI — Predictive Cyber-Defense & Attack Forecasting</title>
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Outfit"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            soc: {
              bg: '#060913',
              card: '#0c1322',
              cardBorder: '#1e293b',
              sidebar: '#080d1a',
              accent: '#00f0ff',
              accentHover: '#00c8d6',
              blue: '#3b82f6',
              green: '#10b981',
              amber: '#f59e0b',
              red: '#ef4444',
              purple: '#8b5cf6',
              muted: '#64748b'
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone for Client Execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #060913;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }
    .glow-cyan {
      box-shadow: 0 0 25px -5px rgba(0, 240, 255, 0.25);
    }
    .glow-red {
      box-shadow: 0 0 25px -5px rgba(239, 68, 68, 0.35);
    }
    .glass-card {
      background: rgba(12, 19, 34, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .glass-card:hover {
      border-color: rgba(0, 240, 255, 0.25);
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #060913;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00f0ff;
    }
  </style>
</head>
<body class="bg-soc-bg text-slate-100 min-h-screen antialiased selection:bg-soc-accent selection:text-black">
  <div id="root"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Lucide-style SVG Icons ---
    const IconShield = () => <svg className="w-5 h-5 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>;
    const IconActivity = () => <svg className="w-5 h-5 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>;
    const IconLayers = () => <svg className="w-5 h-5 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>;
    const IconEye = () => <svg className="w-5 h-5 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>;
    const IconCrosshair = () => <svg className="w-5 h-5 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="10" strokeWidth="2"/><path strokeWidth="2" d="M22 12h-4M6 12H2M12 6V2M12 22v-4"/></svg>;
    const IconBarChart = () => <svg className="w-5 h-5 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>;
    const IconUpload = () => <svg className="w-5 h-5 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>;
    const IconInfo = () => <svg className="w-5 h-5 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
    const IconPlay = () => <svg className="w-4 h-4 inline-block" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6z"/></svg>;
    const IconAlertTriangle = () => <svg className="w-5 h-5 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>;

    // --- Main App Component ---
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [isDemoMode, setIsDemoMode] = useState(true);
      const [demoStates, setDemoStates] = useState([]);
      const [demoForecast, setDemoForecast] = useState(null);
      const [evalReport, setEvalReport] = useState(null);
      const [kSteps, setKSteps] = useState(3);
      const [loading, setLoading] = useState(false);
      const [demoError, setDemoError] = useState(null);
      const [uploadedSummary, setUploadedSummary] = useState(null);
      const [uploadedFileName, setUploadedFileName] = useState('');
      const [backendHealth, setBackendHealth] = useState({ status: 'connecting', problem_statement: 'SIH26153 (NTRO)' });

      // Fetch initial data
      useEffect(() => {
        // Health check
        fetch('/api/health')
          .then(r => r.json())
          .then(data => setBackendHealth(data))
          .catch(() => setBackendHealth({ status: 'offline', problem_statement: 'SIH26153 (NTRO)' }));

        // Load demo data
        loadDemoScenario(kSteps);

        // Load evaluation report
        fetch('/api/evaluation/metrics')
          .then(r => r.json())
          .then(data => setEvalReport(data))
          .catch(e => console.error(e));
      }, []);

      const loadDemoScenario = async (steps, navigate = false) => {
        setLoading(true);
        setDemoError(null);
        try {
          const [statesRes, forecastRes] = await Promise.all([
            fetch('/api/demo/states').then(r => {
              if (!r.ok) throw new Error(`Demo states request failed: ${r.status}`);
              return r.json();
            }),
            fetch(`/api/demo/forecast?k_steps=${steps}`).then(r => {
              if (!r.ok) throw new Error(`Demo forecast request failed: ${r.status}`);
              return r.json();
            })
          ]);
          setDemoStates(statesRes.states || []);
          setDemoForecast(forecastRes);
          setIsDemoMode(true);
          if (navigate) {
            setActiveTab('attack-forecast');
          }
        } catch (err) {
          console.error('Failed to load demo scenario:', err);
          setDemoError(err.message || 'Demo scenario failed to load. Check backend connection.');
        } finally {
          setLoading(false);
        }
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setLoading(true);
        setUploadedFileName(file.name);

        const formData = new FormData();
        formData.append('file', file);

        try {
          const res = await fetch('/api/data/upload', { method: 'POST', body: formData });
          if (!res.ok) {
            const err = await res.json();
            alert('Upload error: ' + (err.detail || 'File processing failed'));
            return;
          }
          const data = await res.json();
          setUploadedSummary(data.summary);
          setIsDemoMode(false);
          setActiveTab('data-analysis');
        } catch (err) {
          alert('Upload failed: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      // Current state values
      const currentState = demoStates.length > 0 ? demoStates[demoStates.length - 1] : null;
      const currentProb = demoForecast ? demoForecast.current_infiltration_probability : 0.74;
      const currentStage = demoForecast ? demoForecast.current_stage : 'Reconnaissance';

      return (
        <div className="flex min-h-screen bg-soc-bg font-sans">
          {/* Sidebar Navigation */}
          <aside className="w-64 bg-soc-sidebar border-r border-soc-cardBorder flex flex-col justify-between shrink-0">
            <div>
              {/* Brand & Logo */}
              <div className="p-5 border-b border-soc-cardBorder flex items-center space-x-3">
                <div className="w-10 h-10 rounded-lg bg-gradient-to-tr from-soc-accent to-soc-blue flex items-center justify-center text-black font-extrabold text-xl shadow-lg shadow-cyan-500/20">
                  N
                </div>
                <div>
                  <h1 className="font-heading font-bold text-lg text-white tracking-wider">NETFORESIGHT</h1>
                  <p className="text-xs font-mono text-soc-accent">AI ATTACK FORECAST</p>
                </div>
              </div>

              {/* Navigation Items */}
              <nav className="p-3 space-y-1">
                {[
                  { id: 'dashboard', label: 'SOC Dashboard', icon: <IconShield /> },
                  { id: 'data-analysis', label: 'Data Analysis', icon: <IconUpload /> },
                  { id: 'attack-forecast', label: 'Attack Forecast', icon: <IconActivity /> },
                  { id: 'network-states', label: 'Network States', icon: <IconLayers /> },
                  { id: 'explainability', label: 'Explainability', icon: <IconEye /> },
                  { id: 'mitre-attack', label: 'MITRE ATT&CK', icon: <IconCrosshair /> },
                  { id: 'model-evaluation', label: 'Model Evaluation', icon: <IconBarChart /> },
                  { id: 'about', label: 'About & SIH Specs', icon: <IconInfo /> },
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all ${
                      activeTab === item.id
                        ? 'bg-soc-blue/15 text-soc-accent border-l-4 border-soc-accent font-semibold shadow-inner'
                        : 'text-slate-400 hover:text-white hover:bg-slate-800/40'
                    }`}
                  >
                    <span className={activeTab === item.id ? 'text-soc-accent' : 'text-slate-400'}>{item.icon}</span>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            {/* Sidebar Footer Metadata */}
            <div className="p-4 border-t border-soc-cardBorder bg-slate-950/40 text-xs text-slate-400 space-y-2 font-mono">
              <div className="flex items-center justify-between">
                <span className="text-slate-400">SIH PROBLEM:</span>
                <span className="text-soc-accent font-bold">SIH26153</span>
              </div>
              <div className="flex items-center justify-between">
                <span className="text-slate-400">ORG:</span>
                <span className="text-slate-200">NTRO</span>
              </div>
              <div className="flex items-center justify-between">
                <span className="text-slate-400">BACKEND:</span>
                <span className={backendHealth.status === 'healthy' ? 'text-emerald-400' : 'text-amber-400'}>
                  ● {backendHealth.status.toUpperCase()}
                </span>
              </div>
            </div>
          </aside>

          {/* Main Content Area */}
          <main className="flex-1 flex flex-col min-w-0 overflow-y-auto">
            {/* Top Header Bar */}
            <header className="h-16 bg-soc-sidebar/70 backdrop-blur-md border-b border-soc-cardBorder px-8 flex items-center justify-between sticky top-0 z-30">
              <div className="flex items-center space-x-4">
                <h2 className="text-lg font-heading font-semibold text-white capitalize">
                  {activeTab.replace('-', ' ')}
                </h2>
                {isDemoMode && (
                  <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-mono font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/30 animate-pulse">
                    ⚠️ DEMO MODE / PREPROCESSED DATA
                  </span>
                )}
              </div>

              <div className="flex flex-col items-end space-y-1">
                <div className="flex items-center space-x-4">
                {/* Demo Scenario Runner */}
                <button
                  id="run-demo-btn"
                  onClick={() => loadDemoScenario(kSteps, true)}
                  disabled={loading}
                  className={`px-3.5 py-1.5 rounded-lg bg-gradient-to-r from-soc-accent/20 to-soc-blue/20 hover:from-soc-accent/30 hover:to-soc-blue/30 border border-soc-accent/40 text-soc-accent text-xs font-mono font-semibold flex items-center space-x-2 transition-all shadow-sm ${loading ? 'opacity-60 cursor-not-allowed' : ''}`}
                >
                  {loading ? (
                    <svg className="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                      <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
                      <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
                    </svg>
                  ) : <IconPlay />}
                  <span>{loading ? 'Loading...' : 'Run Attack Forecast Demo'}</span>
                </button>

                {/* File Upload Trigger */}
                <label className="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 text-xs font-mono font-semibold flex items-center space-x-2 cursor-pointer transition-all">
                  <IconUpload />
                  <span>Upload Flow CSV</span>
                  <input type="file" accept=".csv" onChange={handleFileUpload} className="hidden" />
                </label>
                </div>
                {demoError && (
                  <div className="text-xs font-mono text-red-400 bg-red-500/10 border border-red-500/30 px-3 py-1 rounded-lg max-w-sm text-right">
                    ⚠ {demoError}
                  </div>
                )}
              </div>
            </header>

            {/* View Container */}
            <div className="p-8 space-y-8 flex-1">
              {activeTab === 'dashboard' && (
                <DashboardView
                  demoStates={demoStates}
                  demoForecast={demoForecast}
                  currentProb={currentProb}
                  currentStage={currentStage}
                  currentState={currentState}
                  isDemoMode={isDemoMode}
                  kSteps={kSteps}
                  setKSteps={(k) => { setKSteps(k); loadDemoScenario(k); }}
                />
              )}

              {activeTab === 'data-analysis' && (
                <DataAnalysisView
                  uploadedSummary={uploadedSummary}
                  fileName={uploadedFileName}
                  handleFileUpload={handleFileUpload}
                  demoStates={demoStates}
                />
              )}

              {activeTab === 'attack-forecast' && (
                <AttackForecastView
                  demoForecast={demoForecast}
                  demoStates={demoStates}
                  kSteps={kSteps}
                  setKSteps={(k) => { setKSteps(k); loadDemoScenario(k); }}
                />
              )}

              {activeTab === 'network-states' && (
                <NetworkStatesView demoStates={demoStates} />
              )}

              {activeTab === 'explainability' && (
                <ExplainabilityView demoForecast={demoForecast} currentState={currentState} />
              )}

              {activeTab === 'mitre-attack' && (
                <MitreAttackView demoForecast={demoForecast} />
              )}

              {activeTab === 'model-evaluation' && (
                <ModelEvaluationView evalReport={evalReport} />
              )}

              {activeTab === 'about' && (
                <AboutView />
              )}
            </div>
          </main>
        </div>
      );
    }

    // --- VIEW 1: Dashboard View ---
    function DashboardView({ demoStates, demoForecast, currentProb, currentStage, currentState, isDemoMode, kSteps, setKSteps }) {
      const getStageColor = (stage) => {
        switch (stage) {
          case 'Normal': return 'text-emerald-400 bg-emerald-500/10 border-emerald-500/30';
          case 'Suspicious': return 'text-amber-400 bg-amber-500/10 border-amber-500/30';
          case 'Reconnaissance': return 'text-orange-400 bg-orange-500/10 border-orange-500/30';
          case 'Initial Access': return 'text-red-400 bg-red-500/10 border-red-500/30';
          case 'Lateral Movement': return 'text-purple-400 bg-purple-500/10 border-purple-500/30';
          default: return 'text-slate-400 bg-slate-500/10 border-slate-500/30';
        }
      };

      return (
        <div className="space-y-6">
          {/* Top SOC Status Banner */}
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div className="glass-card p-5 rounded-xl border border-soc-cardBorder flex items-center justify-between">
              <div>
                <p className="text-xs font-mono text-slate-400 uppercase tracking-wider">Infiltration Probability</p>
                <div className="flex items-baseline space-x-2 mt-1">
                  <span className={`text-3xl font-extrabold font-mono ${currentProb > 0.6 ? 'text-red-400' : currentProb > 0.3 ? 'text-amber-400' : 'text-emerald-400'}`}>
                    {(currentProb * 100).toFixed(1)}%
                  </span>
                  <span className="text-xs text-slate-400 font-mono">forecasted</span>
                </div>
              </div>
              <div className="w-14 h-14 rounded-full border-4 border-soc-cardBorder border-t-soc-accent flex items-center justify-center font-mono font-bold text-xs">
                {(currentProb * 100).toFixed(0)}%
              </div>
            </div>

            <div className="glass-card p-5 rounded-xl border border-soc-cardBorder">
              <p className="text-xs font-mono text-slate-400 uppercase tracking-wider">Predicted Kill-Chain Stage</p>
              <div className="mt-2">
                <span className={`inline-block px-3 py-1 rounded-md text-sm font-semibold font-mono border ${getStageColor(currentStage)}`}>
                  {currentStage}
                </span>
              </div>
            </div>

            <div className="glass-card p-5 rounded-xl border border-soc-cardBorder">
              <p className="text-xs font-mono text-slate-400 uppercase tracking-wider">Forecast Horizon (K)</p>
              <div className="flex items-center space-x-3 mt-1">
                <span className="text-3xl font-extrabold font-mono text-soc-accent">+{kSteps * 5}s</span>
                <span className="text-xs text-slate-400 font-mono">(K = {kSteps} windows)</span>
              </div>
            </div>

            <div className="glass-card p-5 rounded-xl border border-soc-cardBorder">
              <p className="text-xs font-mono text-slate-400 uppercase tracking-wider">Active State Metric</p>
              <div className="flex items-baseline space-x-2 mt-1">
                <span className="text-3xl font-extrabold font-mono text-white">
                  {currentState ? currentState.active_flows : 65}
                </span>
                <span className="text-xs text-slate-400 font-mono">flows / 5s</span>
              </div>
            </div>
          </div>

          {/* Central Interactive Forecast Chart */}
          <div className="glass-card p-6 rounded-xl border border-soc-cardBorder">
            <div className="flex items-center justify-between mb-4">
              <div>
                <h3 className="font-heading font-semibold text-lg text-white">Temporal Attack Progression & K-Step Forecast</h3>
                <p className="text-xs text-slate-400 font-mono">
                  State transition world model trajectory P(S(t+1) | S(t)) across 5s windows
                </p>
              </div>

              {/* K-step selector */}
              <div className="flex items-center space-x-2 text-xs font-mono">
                <span className="text-slate-400">Forecast Steps (K):</span>
                {[1, 2, 3, 4, 5].map((k) => (
                  <button
                    key={k}
                    onClick={() => setKSteps(k)}
                    className={`w-7 h-7 rounded font-bold transition-all ${
                      kSteps === k ? 'bg-soc-accent text-black' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                    }`}
                  >
                    {k}
                  </button>
                ))}
              </div>
            </div>

            {/* SVG Forecast Graph */}
            <div className="h-64 w-full relative flex items-end pt-8 pb-6 px-4">
              <div className="absolute inset-0 flex flex-col justify-between pointer-events-none opacity-15 border-b border-slate-700">
                <div className="border-b border-dashed border-slate-600"></div>
                <div className="border-b border-dashed border-slate-600"></div>
                <div className="border-b border-dashed border-slate-600"></div>
              </div>

              {/* Bars for historical states + Forecasted steps */}
              <div className="flex-1 flex items-end justify-around h-full z-10">
                {demoStates.map((s, idx) => {
                  const heightPct = Math.min(100, Math.max(15, s.port_scan_score * 100));
                  return (
                    <div key={idx} className="flex flex-col items-center space-y-2 group">
                      <span className="text-[10px] font-mono text-slate-400 opacity-0 group-hover:opacity-100 transition-opacity">
                        {(s.port_scan_score * 100).toFixed(0)}%
                      </span>
                      <div
                        style={{ height: `${heightPct}%` }}
                        className="w-10 rounded-t-md bg-gradient-to-t from-blue-600/60 to-cyan-400 border-t-2 border-soc-accent transition-all duration-500 shadow-md group-hover:brightness-125"
                      ></div>
                      <span className="text-xs font-mono text-slate-300">W{s.window_index}</span>
                      <span className="text-[10px] font-mono text-slate-400">{s.window_index * 5}s</span>
                    </div>
                  );
                })}

                {/* Forecast steps */}
                {demoForecast && demoForecast.forecast_steps.map((f, idx) => {
                  const heightPct = Math.min(100, f.forecasted_probability * 100);
                  return (
                    <div key={idx} className="flex flex-col items-center space-y-2 group">
                      <span className="text-[10px] font-mono text-red-400 font-bold">
                        {(f.forecasted_probability * 100).toFixed(0)}%
                      </span>
                      <div
                        style={{ height: `${heightPct}%` }}
                        className="w-10 rounded-t-md bg-gradient-to-t from-red-600/50 to-red-400/80 border-t-2 border-red-400 border-dashed transition-all duration-500 shadow-lg shadow-red-500/20 animate-pulse"
                      ></div>
                      <span className="text-xs font-mono text-red-400 font-bold">S(t+{f.step_index})</span>
                      <span className="text-[10px] font-mono text-red-300">+{f.time_offset_seconds}s</span>
                    </div>
